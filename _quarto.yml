project:
  type: book
  output-dir: docs
  resources:
    - kitchen/
    - components/
    # kitchen/ builds image paths in JS (`${IMG}${...}.png`), which Quarto cannot
    # discover by static analysis. Ship the whole folder or those images 404.
    - assets/img/
    # GitHub Pages skips folders starting with "_" (e.g. site_libs) without this.
    # Declared as a resource so `quarto render` recreates it on every build.
    - .nojekyll

book:
  title: "Virome City"
  subtitle: "Adventures in the human virome"
  author: "Nickole"
  site-url: https://nickole97.github.io/ViromeCity/
  repo-url: https://github.com/nickole97/ViromeCity/
  repo-branch: main
  repo-actions: [edit, issue]
  search: true
  page-navigation: true
  sidebar:
    style: docked
    collapse-level: 2
    # Fivi is the wordmark. The groups are fixed, not accordions — the chevrons
    # and the collapse triggers are turned off in assets/styles.scss.
    logo: assets/img/Fivi.png
  chapters:
    - index.qmd
    - part: "The four questions"
      chapters:
        - sections/what.qmd
        - sections/why.qmd
        - sections/where.qmd
        - sections/how-to.qmd
    - part: "Then the tool"
      chapters:
        - sections/kitchen.qmd
  # Appendices are out of the book until References has content — an empty
  # appendix group in the sidebar reads as a defect. Restore this block (and
  # sections/references.qmd is still in the repo) once there is something to cite.
  # appendices:
  #   - sections/references.qmd
  page-footer:
    left: "Virome City — a guide to your first human virome."
    right: "Built with [Quarto](https://quarto.org)."

lang: en

format:
  html:
    theme:
      - cosmo
      - assets/styles.scss
    # The reading measure. Set here rather than as a max-width in the stylesheet
    # so that .column-body-outset and .column-page size themselves against it —
    # capping main.content instead breaks the grid on any page that uses them.
    #
    # The column caps at 1080px and the prose inside it stays at 40rem, so the
    # page fills the window instead of leaving a dead margin on the right,
    # while the line length stays where the book set it. Quarto's track is a
    # minmax, so the column still shrinks with the window; this only raises the
    # ceiling.
    #
    # 928px, not 1080: with a docked sidebar Quarto resolves the body column as
    # `calc(body-width + 200px - 3em)`, so 928 + 200 - 48 = 1080. Measured, not
    # derived — re-check it if Quarto's grid changes.
    grid:
      body-width: 928px
    # No right-hand table of contents. The book is read in order, the sidebar
    # already lists every chapter, and the margin it frees is what lets a
    # figure be wider than the prose without colliding with anything.
    toc: false
    number-sections: false
    link-external-newwindow: true
    fig-cap-location: bottom
    include-in-header: assets/fonts.html
