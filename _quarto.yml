project:
  type: book
  output-dir: docs
  resources:
    - kitchen/
    - components/
    # kitchen/ builds image paths in JS (`${IMG}${...}.png`), which Quarto cannot
    # discover by static analysis. Ship the whole folder or those images 404.
    - assets/img/
    # GitHub Pages skips folders starting with "_" (e.g. site_libs) without this.
    # Declared as a resource so `quarto render` recreates it on every build.
    - .nojekyll

book:
  title: "Virome City"
  subtitle: "Adventures in the human virome"
  author: "Nickole"
  site-url: https://nickole97.github.io/ViromeCity/
  repo-url: https://github.com/nickole97/ViromeCity/
  repo-branch: main
  repo-actions: [edit, issue]
  search: true
  page-navigation: true
  sidebar:
    style: docked
    collapse-level: 2
    # Fivi is the wordmark. The groups are fixed, not accordions — the chevrons
    # and the collapse triggers are turned off in assets/styles.scss.
    logo: assets/img/Fivi.png
  chapters:
    - index.qmd
    - part: "The four questions"
      chapters:
        - sections/what.qmd
        - sections/why.qmd
        - sections/where.qmd
        - sections/how-to.qmd
    - part: "Then the tool"
      chapters:
        - sections/kitchen.qmd
  # Appendices are out of the book until References has content — an empty
  # appendix group in the sidebar reads as a defect. Restore this block (and
  # sections/references.qmd is still in the repo) once there is something to cite.
  # appendices:
  #   - sections/references.qmd
  page-footer:
    left: "Virome City — a guide to your first human virome."
    right: "Built with [Quarto](https://quarto.org)."

lang: en

format:
  html:
    theme:
      - cosmo
      - assets/styles.scss
    toc: true
    toc-title: "On this page"
    toc-depth: 3
    number-sections: false
    link-external-newwindow: true
    fig-cap-location: bottom
    include-in-header: assets/fonts.html
