project:
  type: book
  output-dir: docs
  resources:
    - kitchen/
    - components/
    # kitchen/ builds image paths in JS (`${IMG}${...}.png`), which Quarto cannot
    # discover by static analysis. Ship the whole folder or those images 404.
    - assets/img/
    # The hand-written drafts, kept published while the chapters are migrated
    # one at a time, so that nothing already written stops being reachable.
    - legacy/
    # GitHub Pages skips folders starting with "_" (e.g. site_libs) without this.
    # Declared as a resource so `quarto render` recreates it on every build.
    - .nojekyll
  # The sampling map's reading list is edited as data/studies.csv and folded into
  # components/sampling-map.html here, so nobody hand-edits minified JSON inside a
  # 145 KB file. Stdlib only — a fresh clone renders without installing anything.
  # See data/README.md.
  pre-render:
    - scripts/sync-map-studies.py

book:
  title: "Virome City"
  subtitle: "Adventures in the human virome"
  author: "Nickole"
  site-url: https://nickole97.github.io/ViromeCity/
  repo-url: https://github.com/nickole97/ViromeCity/
  repo-branch: main
  repo-actions: [edit, issue]
  search: true
  page-navigation: true
  sidebar:
    style: docked
    collapse-level: 2
    # The wordmark is the illustration: Fivi in the city, spanning the sidebar.
    # There is no name beside it — the footer carries "Virome City", and a
    # second copy in the menu is what made the first one hard to see. The groups
    # are fixed, not accordions; the chevrons and collapse triggers are turned
    # off in assets/styles.scss.
    logo: assets/img/fivi_bogota_mejor.svg
    # El enlace al repositorio, al pie del panel en vez de flotando sobre la
    # ilustración. La marca es una imagen; una herramienta encima la ensucia.
    footer: "[Source on GitHub](https://github.com/nickole97/ViromeCity/)"
  chapters:
    - index.qmd
    - part: "The four districts"
      chapters:
        - sections/what.qmd
        - sections/why.qmd
        - sections/where.qmd
        - sections/how-to.qmd
    - part: "Then the tool"
      chapters:
        - sections/kitchen.qmd
  # Appendices are out of the book until References has content — an empty
  # appendix group in the sidebar reads as a defect. Restore this block (and
  # sections/references.qmd is still in the repo) once there is something to cite.
  # appendices:
  #   - sections/references.qmd
  # The navy band that closes every page. The spans carry the type; the styles
  # are .foot-* in assets/styles.scss. Left is what the book is, right is who
  # keeps it — the Quarto credit moved out of the footer to keep those two.
  # Two tiers. Row one is identity (left) and credit (right), built the same
  # way so they read as a pair; row two is the colophon, under a hairline.
  # Quarto only offers left / center / right, so the centre slot is the one
  # the stylesheet turns into that second row.
  page-footer:
    left: "[Virome City]{.foot-kicker}[A guide to navigate &amp; analyze your first human virome — and not get lost trying.]{.foot-title}"
    right: "[Maintained by]{.foot-label}[Nickole Villabona &amp; Scott Handley]{.foot-names}[and contributors]{.foot-names-sub}"
    center: "[Built with [Quarto](https://quarto.org).]{.foot-colophon}"

lang: en

format:
  html:
    theme:
      - cosmo
      - assets/styles.scss
    # The reading measure. Set here rather than as a max-width in the stylesheet
    # so that .column-body-outset and .column-page size themselves against it —
    # capping main.content instead breaks the grid on any page that uses them.
    #
    # The right margin holds the chapter contents, so the column stops where
    # that list begins. 668 + 200 - 48 = 820px of column. Measured, not
    # derived — re-check it if Quarto's grid changes.
    grid:
      body-width: 668px
    # The chapter contents, in the right margin. Depth 3 so the three axes
    # appear nested under the section that introduces them: a reader in What
    # sees the chapter's stops, not just its title.
    toc: true
    toc-title: "In this chapter"
    toc-depth: 3
    number-sections: false
    link-external-newwindow: true
    fig-cap-location: bottom
    include-in-header: assets/fonts.html
    # Sets the height of an embedded interactive from the height the
    # widget itself reports. See assets/embed.js.
    include-after-body: assets/embed.js
