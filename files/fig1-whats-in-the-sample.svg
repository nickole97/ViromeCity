<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 654" width="760" height="654" role="img" aria-labelledby="ttl dsc">
<title id="ttl">What's in the sample?</title>
<desc id="dsc">Four stacked bars comparing stool, vaginal, skin and blood sequencing libraries. Host DNA rises from under one percent in stool to 80-95 percent in blood, while the viral fraction stays a sliver everywhere. A biomass row underneath shows that stool and vaginal samples are rich in microbial material while skin and blood are not.</desc>

<style>
  .h {font-family:"Space Grotesk","IBM Plex Sans",system-ui,sans-serif;font-weight:700}
  .b {font-family:"IBM Plex Sans",system-ui,sans-serif}
  .m {font-family:"IBM Plex Mono",ui-monospace,monospace}
</style>

<rect width="760" height="654" fill="#FAF6EF"/>

<text class="h" x="44" y="46" font-size="25" fill="#14213d">What's in the sample?</text>
<text class="b" x="44" y="72" font-size="13.5" fill="#6B6459">Sequencing reads everything. What competes with your virus — and whether you can recover<tspan x="44" dy="18">it at all — depends on where the sample came from.</tspan></text>

<g class="b" font-size="12" fill="#6B6459">
  <rect x="44" y="118" width="11" height="11" rx="2" fill="#E8B04B"/><text x="61" y="128">Everything else</text>
  <rect x="176" y="118" width="11" height="11" rx="2" fill="#B5626F"/><text x="193" y="128">Host (human DNA)</text>
  <rect x="330" y="118" width="11" height="11" rx="2" fill="#0891B2"/><text x="347" y="128">Virus</text>
</g>

