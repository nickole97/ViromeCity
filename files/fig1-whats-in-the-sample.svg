<text class="b" x="44" y="594" font-size="10.5" fill="#A39A8C">Educational and schematic, not statistical — bar heights are illustrative and thin bands are drawn thicker so they stay visible. Adult samples; values shift with collection,</text>
<text class="b" x="44" y="606" font-size="10.5" fill="#A39A8C">extraction and library protocol. † Sources disagree: HMP swab data report &gt;90% host for vaginal and skin. Biomass, not host fraction, is what predicts recovery.</text>
