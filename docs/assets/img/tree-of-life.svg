    </g>
    <text class="cls-32" transform="translate(357.06 32.25)"><tspan x="0" y="0">Enters the host cell whole. </tspan><tspan x="0" y="14.4">Includes classic pathogens </tspan><tspan x="0" y="28.8">like herpes, papilloma, and </tspan><tspan x="0" y="43.2">HI</tspan><tspan class="cls-30" x="12" y="43.2">V</tspan><tspan x="18.9" y="43.2">.</tspan></text>
