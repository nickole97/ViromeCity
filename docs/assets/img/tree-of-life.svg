    <text class="cls-32" transform="translate(0 33.17)"><tspan x="0" y="0">The most abundant virus on </tspan><tspan x="0" y="14.4">Earth — dominates gut and </tspan><tspan x="0" y="28.8">saliva. Injects only its </tspan><tspan x="0" y="43.2">genome; the capsid stays </tspan><tspan x="0" y="57.6">outside.</tspan></text>
