    </g>
    <text class="cls-32" transform="translate(176.32 33.44)"><tspan x="0" y="0">Understudied. Hosts range </tspan><tspan x="0" y="14.4">from extremophiles to gut </tspan><tspan x="0" y="28.8">microbes. Wildly diverse </tspan><tspan x="0" y="43.2">morpholog</tspan><tspan class="cls-29" x="56.7" y="43.2">y</tspan><tspan x="61.81" y="43.2">. </tspan></text>
