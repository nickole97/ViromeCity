<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img"
     font-family="'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>What a stool sequencing library is made of</title>
  <desc>A single stacked bar for a stool sample. Almost all of it is the gut's own
  microbial background; human DNA is under 1%; virus is roughly 1 to 5%.</desc>

  <!-- Virome City — District 3. The stool column alone, drawn to the same
       proportions and colours as components/whats-in-the-sample.html, so the
       reader recognises this bar when it reappears there as the first of four.
       Band heights follow that figure's draw values (rest 95, host 2, virus 3);
       thin bands are drawn thicker than life so they stay visible. -->

  <!-- the bar -->
  <g>
    <rect x="60" y="22" width="130" height="285" fill="#E8B04B"/>
    <rect x="60" y="291" width="130" height="7"  fill="#B5626F"/>
    <rect x="60" y="298" width="130" height="9"  fill="#0891B2"/>
    <rect x="60" y="22" width="130" height="285" fill="none" stroke="#14213d" stroke-opacity=".14"/>
  </g>
  <text x="125" y="322" text-anchor="middle" font-size="13.5" font-weight="600" fill="#14213d">Stool</text>

  <!-- No leader lines: the two thin bands sit on top of each other, so any leader
       to them crosses the one above. The swatches do the connecting instead. -->
  <g>
    <rect x="248" y="92" width="11" height="11" rx="2" fill="#E8B04B"/>
    <rect x="248" y="200" width="11" height="11" rx="2" fill="#B5626F"/>
    <rect x="248" y="268" width="11" height="11" rx="2" fill="#0891B2"/>
  </g>

  <g fill="#14213d">
    <text x="268" y="102" font-size="13.5" font-weight="600">Everything else</text>
    <text x="268" y="125" font-size="12.5" fill="#5c6b82">The gut's own microbiome, plus dietary DNA and a</text>
    <text x="268" y="142" font-size="12.5" fill="#5c6b82">large unclassified fraction. The densest microbial</text>
    <text x="268" y="159" font-size="12.5" fill="#5c6b82">background in the body.</text>

    <text x="268" y="210" font-size="13.5" font-weight="600">Host <tspan font-family="'IBM Plex Mono', ui-monospace, monospace" font-weight="500" fill="#8E3F4C">&lt;1%</tspan></text>
    <text x="268" y="233" font-size="12.5" fill="#5c6b82">Barely any human DNA survives the trip. Stool is the</text>
    <text x="268" y="250" font-size="12.5" fill="#5c6b82">rare human sample where you are not the problem.</text>

    <text x="268" y="278" font-size="13.5" font-weight="600">Virus <tspan font-family="'IBM Plex Mono', ui-monospace, monospace" font-weight="500" fill="#0891B2">~1&#8211;5%</tspan></text>
    <text x="268" y="301" font-size="12.5" fill="#5c6b82">Measured at 2.4% of reads by bulk sequencing — and it</text>
    <text x="268" y="318" font-size="12.5" fill="#5c6b82">rises to 63&#8211;73% once you enrich for particles.</text>
  </g>
</svg>
